<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenArm Lab</title><style>body{font-family:system-ui,sans-serif;background:#f6f5f1;color:#302e29;display:grid;place-items:center;min-height:100vh;margin:0}main{padding:2.5rem;background:#fffefa;border-radius:1rem;text-align:center}a{color:#a96d50}</style></head><body><main><h1>OpenArm Lab</h1><p id="status">正在进入平台…</p><a id="link" hidden>进入平台</a></main><script>fetch("https://raw.githubusercontent.com/wensikai439/OpenArmLab-entry/main/target.json?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(({url})=>{const u=new URL(url);if(u.protocol!=="https:"||!(/^[a-z0-9-]+[.]trycloudflare[.]com$/).test(u.hostname)||u.origin!==url)throw Error();document.getElementById("link").href=url;document.getElementById("link").hidden=false;location.replace(url)}).catch(()=>{document.getElementById("status").textContent="暂时无法获取平台地址，请稍后重试。"});</script></body></html>
